    <script>
        const numbers=[1,55,6,1,2,3]
        //reduce  összegzésre használják:
        const total=numbers.reduce((sum,item)=>sum+item , 0)
        console.log(total);

        const products = [
  { name: "Alma", category: "Gyümölcs", price: 150, quantity: 3 },
  { name: "Banán", category: "Gyümölcs", price: 100, quantity: 5 },
  { name: "Tej", category: "Tejtermék", price: 300, quantity: 2 },
  { name: "Sajt", category: "Tejtermék", price: 450, quantity: 1 },
  { name: "Kenyér", category: "Pékség", price: 200, quantity: 2 },
  { name: "Tojás", category: "Tejtermék", price: 250, quantity: 12 },

  { name: "Hal", category: "Hús", price: 900, quantity: 1 },
];
const total2=products.reduce((acc,obj)=>acc+obj.price*obj.quantity,0)
console.log(total2);
// a 200 alatti termékek értéke

    </script>
